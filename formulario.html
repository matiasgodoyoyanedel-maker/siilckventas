<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Postulación Vendedor - SiilckVentas</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap');
  body{background-color:#09090b;color:#f4f4f5;font-family:'Plus Jakarta Sans',sans-serif}
  h1,h2,h3,h4{font-family:'Outfit',sans-serif}
  .web-panel{background:rgba(18,18,24,0.95);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.07);box-shadow:0 20px 50px rgba(0,0,0,0.6)}
  .drag-drop-zone{border:2px dashed rgba(234,179,8,0.3);transition:all .2s ease}
  .drag-drop-zone:hover{border-color:#eab308;background:rgba(234,179,8,0.03)}
</style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center">

<div class="max-w-lg w-full web-panel rounded-3xl p-8 space-y-6 border border-yellow-500/30">
  <div class="text-center space-y-2">
    <div class="w-14 h-14 rounded-2xl bg-yellow-500 text-zinc-950 flex items-center justify-center text-2xl font-black mx-auto shadow-lg"><i class="fas fa-file-signature"></i></div>
    <h2 class="text-xl font-black text-white">Formulario de Postulación de Vendedor</h2>
    <p class="text-xs text-zinc-400">Completa cada campo, sube tus fotos de referencia y detalla tus motivos para ser parte del equipo oficial.</p>
  </div>

  <div class="space-y-4 text-xs">
    <div>
      <label class="block text-[10px] uppercase font-bold text-zinc-300 mb-1">Motivos y Experiencia en Ventas Gamer *</label>
      <textarea id="form-experiencia" rows="3" placeholder="Cuéntanos por qué quieres vender, tu experiencia previa, juegos que dominas..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white resize-none focus:outline-none focus:border-yellow-500"></textarea>
    </div>

    <div>
      <label class="block text-[10px] uppercase font-bold text-zinc-300 mb-1">Redes Sociales o Medio de Contacto Directo *</label>
      <input type="text" id="form-contacto" placeholder="Ej: Discord (@usuario), WhatsApp o Instagram" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500">
    </div>
    
    <div>
      <label class="block text-[10px] uppercase font-bold text-zinc-300 mb-1">Subir Fotos / Capturas de Referencia *</label>
      <div class="drag-drop-zone rounded-xl p-4 text-center cursor-pointer bg-zinc-900/50" onclick="document.getElementById('form-foto-input').click()">
        <input type="file" id="form-foto-input" accept="image/*" class="hidden" onchange="manejarFotoPostulacion(this)">
        <p class="text-xs text-zinc-300" id="form-foto-label">Toca aquí para seleccionar una imagen de tu dispositivo o PC</p>
      </div>
    </div>

    <button onclick="enviarPostulacionVendedor()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-zinc-950 font-black py-3.5 rounded-xl uppercase tracking-wider shadow transition">Enviar Solicitud al Administrador</button>
    <a href="index.html" class="block text-center text-zinc-400 hover:text-white pt-2 underline">← Volver al Inicio</a>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD4PyR975err3q8gPX6JOwpnnM5MXnA5C8",authDomain:"siilckventasfull.firebaseapp.com",projectId:"siilckventasfull",storageBucket:"siilckventasfull.firebasestorage.app",messagingSenderId:"1081229515356",appId:"1:1081229515356:web:78ccc9fb4053ee54072499"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let fotoPostulacionBase64 = "";

function manejarFotoPostulacion(input){
  if(input.files && input.files[0]){
    const reader = new FileReader();
    reader.onload = function(e){
      fotoPostulacionBase64 = e.target.result;
      document.getElementById('form-foto-label').innerText = "Imagen cargada con éxito ✅";
    }
    reader.readAsDataURL(input.files[0]);
  }
}

async function enviarPostulacionVendedor(){
  const user = auth.currentUser;
  if(!user){
    alert("Debes iniciar sesión para postular.");
    window.location.href = "login.html";
    return;
  }
  const exp = document.getElementById('form-experiencia').value.trim();
  const contacto = document.getElementById('form-contacto').value.trim();

  if(!exp || !contacto){
    alert("Por favor completa todos los campos requeridos.");
    return;
  }

  await db.collection('postulaciones_vendedores').add({
    uid: user.uid,
    experiencia: exp,
    contacto: contacto,
    fotoReferencia: fotoPostulacionBase64,
    estado: 'pendiente',
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert("Tu solicitud ha sido enviada. Espera que el administrador revise tu postulación y ver si eres apto para ser un vendedor autorizado en Silk Ventas.");
  window.location.href = "index.html";
}
</script>
</body>
</html>

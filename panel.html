<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panel de Administración - SiilckVentas</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap');
  body{background-color:#09090b;color:#f4f4f5;font-family:'Plus Jakarta Sans',sans-serif}
  h1,h2,h3,h4{font-family:'Outfit',sans-serif}
  .web-panel{background:rgba(18,18,24,0.95);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.07);box-shadow:0 20px 50px rgba(0,0,0,0.6)}
</style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

<div class="max-w-4xl w-full space-y-6">
  <div class="web-panel rounded-3xl p-6 border border-rose-500/30 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 border border-rose-500/40 flex items-center justify-center text-xl font-black"><i class="fas fa-tools"></i></div>
      <div>
        <h2 class="text-xl font-black text-white">Panel de Mantención & Control</h2>
        <p class="text-xs text-rose-400 font-bold">Acceso exclusivo del Propietario</p>
      </div>
    </div>
    <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider transition"><i class="fas fa-arrow-left mr-1.5"></i> Volver al Sitio</a>
  </div>

  <div class="web-panel rounded-3xl p-6 space-y-4 border border-zinc-800">
    <h3 class="text-xs font-bold text-yellow-400 uppercase tracking-wider border-b border-zinc-800 pb-3"><i class="fas fa-cogs mr-1.5"></i> Configuración Global del Sistema</h3>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
      <div class="space-y-2">
        <label class="block font-bold text-zinc-300">Modo Mantenimiento Global</label>
        <div class="flex gap-2">
          <button onclick="toggleMantenimiento(true)" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-2.5 rounded-xl uppercase">Activar</button>
          <button onclick="toggleMantenimiento(false)" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-2.5 rounded-xl uppercase">Desactivar</button>
        </div>
      </div>
      <div class="space-y-2">
        <label class="block font-bold text-zinc-300">Tematica Visual del Sitio</label>
        <select id="select-tematica-global" onchange="cambiarTematicaGlobal(this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-white">
          <option value="default">Por Defecto (Gamer)</option>
          <option value="halloween">Halloween 🎃</option>
          <option value="navidad">Navidad ❄️</option>
          <option value="verano">Verano ☀️</option>
          <option value="noche">Noche Oscura 🌑</option>
        </select>
      </div>
    </div>

    <div class="space-y-2 pt-2">
      <label class="block font-bold text-zinc-300 text-xs">Enviar o Desactivar Aviso General</label>
      <input type="text" id="input-aviso-mant" placeholder="Ej: Mantenimiento programado..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-white text-xs">
      <div class="flex gap-2 pt-1">
        <button onclick="enviarAvisoMantenimiento()" class="flex-1 bg-yellow-500 text-zinc-950 font-extrabold py-2.5 rounded-xl uppercase text-xs shadow">Enviar Aviso</button>
        <button onclick="desactivarAvisoMantenimiento()" class="flex-1 bg-zinc-800 text-zinc-300 font-extrabold py-2.5 rounded-xl uppercase text-xs">Desactivar Aviso</button>
      </div>
    </div>
  </div>

  <!-- REVISIÓN DETALLADA DE POSTULACIONES DE VENDEDORES -->
  <div class="web-panel rounded-3xl p-6 space-y-4 border border-zinc-800">
    <h3 class="text-xs font-bold text-yellow-400 uppercase tracking-wider border-b border-zinc-800 pb-3"><i class="fas fa-file-alt mr-1.5"></i> Postulaciones de Nuevos Vendedores (Detalladas)</h3>
    <div id="lista-postulaciones-admin" class="space-y-3">
      <p class="text-xs text-zinc-500 text-center py-6">Cargando postulaciones...</p>
    </div>
  </div>

  <div class="web-panel rounded-3xl p-6 space-y-4 border border-zinc-800">
    <h3 class="text-xs font-bold text-yellow-400 uppercase tracking-wider border-b border-zinc-800 pb-3"><i class="fas fa-users mr-1.5"></i> Listado de Usuarios & Bloqueos Permanentes</h3>
    <div id="lista-usuarios-admin" class="space-y-3">
      <p class="text-xs text-zinc-500 text-center py-6">Cargando usuarios...</p>
    </div>
  </div>
</div>

<!-- MODAL OBSERVAR POSTULACIÓN EN DETALLE -->
<div id="modal-detalle-postulacion" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center z-50 p-4 overflow-y-auto">
  <div class="web-panel max-w-lg w-full p-6 rounded-3xl border border-yellow-500/30 space-y-4 relative animate-page my-8">
    <button onclick="document.getElementById('modal-detalle-postulacion').classList.add('hidden')" class="absolute top-4 right-4 text-zinc-400 hover:text-white w-8 h-8 rounded-full bg-zinc-900 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
    <h3 class="text-base font-black text-yellow-400 uppercase"><i class="fas fa-search mr-2"></i> Observar Postulación Detallada</h3>
    <div id="modal-detalle-contenido" class="space-y-3 text-xs bg-zinc-950 p-4 rounded-2xl border border-zinc-800 text-zinc-300"></div>
    <div class="flex gap-2 pt-2">
      <button id="btn-modal-aprobar" class="flex-1 bg-emerald-600 text-white font-extrabold py-3 rounded-xl uppercase">Aprobar Postulación</button>
      <button id="btn-modal-rechazar" class="flex-1 bg-rose-600 text-white font-extrabold py-3 rounded-xl uppercase">Rechazar & Borrar</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD4PyR975err3q8gPX6JOwpnnM5MXnA5C8",authDomain:"siilckventasfull.firebaseapp.com",projectId:"siilckventasfull",storageBucket:"siilckventasfull.firebasestorage.app",messagingSenderId:"1081229515356",appId:"1:1081229515356:web:78ccc9fb4053ee54072499"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const OWNER_UID="YwjfajkyMXMRHd18eII4dwV03NF3";

auth.onAuthStateChanged(async(u)=>{
  if(!u || u.uid !== OWNER_UID){
    alert("Acceso denegado.");
    window.location.href="index.html";
    return;
  }
  cargarPostulacionesAdmin();
  cargarUsuariosAdmin();
});

async function toggleMantenimiento(estado){
  await db.collection('configuracion').doc('global').set({
    mantenimientoActivo: estado
  }, {merge: true});
  alert(estado ? "¡Modo mantenimiento activado!" : "¡Modo mantenimiento desactivado!");
}

async function cambiarTematicaGlobal(tema){
  await db.collection('configuracion').doc('global').set({
    tematica: tema
  }, {merge: true});
}

async function enviarAvisoMantenimiento(){
  const msg = document.getElementById('input-aviso-mant').value.trim();
  if(!msg) return;
  await db.collection('configuracion').doc('global').set({
    mantenimientoActivo: true,
    avisoMantenimiento: msg
  }, {merge: true});
  alert("¡Aviso general enviado a todos los usuarios!");
}

async function desactivarAvisoMantenimiento(){
  await db.collection('configuracion').doc('global').set({
    mantenimientoActivo: false,
    avisoMantenimiento: ""
  }, {merge: true});
  alert("¡Aviso general desactivado!");
  document.getElementById('input-aviso-mant').value = "";
}

function cargarPostulacionesAdmin(){
  db.collection('postulaciones_vendedores').onSnapshot(snapshot => {
    let h = "";
    snapshot.forEach(doc => {
      const p = doc.data();
      const id = doc.id;
      const estadoPost = p.estado || 'Pendiente';
      const colorEstado = estadoPost === 'Aprobado' ? 'text-emerald-400' : (estadoPost === 'Rechazado' ? 'text-rose-400' : 'text-yellow-400');

      h += `<div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex items-center justify-between text-xs">
        <div>
          <h4 class="font-bold text-white text-sm">${p.nombreCompleto || 'Postulante'} (@${p.username})</h4>
          <p class="text-zinc-400">Discord: ${p.discord || 'N/A'} • Estado: <span class="${colorEstado} font-bold">${estadoPost}</span></p>
        </div>
        <div class="flex gap-2">
          <button onclick="abrirModalDetallePostulacion('${id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl font-bold"><i class="fas fa-search mr-1"></i> Observar Detalle</button>
          <button onclick="aprobarPostulacion('${id}', '${p.uid}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl font-bold">Aprobar</button>
          <button onclick="rechazarPostulacion('${id}', '${p.uid}')" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-2 rounded-xl font-bold">Rechazar & Borrar</button>
        </div>
      </div>`;
    });
    document.getElementById('lista-postulaciones-admin').innerHTML = h || `<p class="text-xs text-zinc-500 text-center py-6">No hay postulaciones registradas.</p>`;
  });
}

async function abrirModalDetallePostulacion(postId){
  const doc = await db.collection('postulaciones_vendedores').doc(postId).get();
  if(!doc.exists) return;
  const p = doc.data();
  const fotoEvidencia = p.fotoEvidencia ? `<div class="w-full h-40 rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800 mt-2"><img src="${p.fotoEvidencia}" class="w-full h-full object-cover"></div>` : "<p class='text-zinc-500'>Sin foto adjunta</p>";

  document.getElementById('modal-detalle-contenido').innerHTML = `
    <p><strong>Nombre Completo:</strong> ${p.nombreCompleto || 'N/A'}</p>
    <p><strong>Usuario (@):</strong> ${p.username || 'N/A'}</p>
    <p><strong>Discord:</strong> ${p.discord || 'N/A'}</p>
    <p><strong>Experiencia:</strong> ${p.experiencia || 'N/A'}</p>
    <p><strong>Motivo / Respuesta:</strong> ${p.motivo || 'N/A'}</p>
    <div><strong>Foto / Captura de Postulación:</strong> ${fotoEvidencia}</div>
  `;

  document.getElementById('btn-modal-aprobar').onclick = () => { aprobarPostulacion(postId, p.uid); document.getElementById('modal-detalle-postulacion').classList.add('hidden'); };
  document.getElementById('btn-modal-rechazar').onclick = () => { rechazarPostulacion(postId, p.uid); document.getElementById('modal-detalle-postulacion').classList.add('hidden'); };

  document.getElementById('modal-detalle-postulacion').classList.remove('hidden');
  document.getElementById('modal-detalle-postulacion').classList.add('flex');
}

async function aprobarPostulacion(postId, userUid){
  await db.collection('postulaciones_vendedores').doc(postId).update({estado: 'Aprobado'});
  if(userUid){
    await db.collection('perfiles').doc(userUid).update({postuladoFormulario: true});
  }
  alert("¡Postulación aprobada con éxito!");
}

async function rechazarPostulacion(postId, userUid){
  // Se borra automáticamente de la base de datos y de la vista
  await db.collection('postulaciones_vendedores').doc(postId).delete();
  if(userUid){
    await db.collection('perfiles').doc(userUid).update({postuladoFormulario: false});
  }
  alert("Postulación rechazada y eliminada correctamente.");
}

function cargarUsuariosAdmin(){
  db.collection('perfiles').onSnapshot(snapshot => {
    let h = "";
    snapshot.forEach(doc => {
      const u = doc.data();
      const uid = doc.id;
      const estadoBloqueo = u.bloqueado ? `<span class="text-rose-400 font-bold">Bloqueado Permanente</span>` : `<span class="text-emerald-400 font-bold">Activo</span>`;
      const btnBloq = u.bloqueado ? 
        `<button onclick="bloquearUsuario('${uid}', false)" class="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-bold">Desbloquear</button>` : 
        `<button onclick="bloquearUsuario('${uid}', true)" class="bg-rose-600 text-white px-3 py-1.5 rounded-xl font-bold">Bloquear Permanentemente</button>`;

      h += `<div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex items-center justify-between text-xs">
        <div>
          <h4 class="font-bold text-white">@${u.username || 'Usuario'}</h4>
          <p class="text-zinc-400 text-[10px]">UID: ${uid} • ${estadoBloqueo}</p>
        </div>
        <div>${btnBloq}</div>
      </div>`;
    });
    document.getElementById('lista-usuarios-admin').innerHTML = h || `<p class="text-xs text-zinc-500 text-center py-6">No hay usuarios registrados.</p>`;
  });
}

async function bloquearUsuario(uid, bloquear){
  await db.collection('perfiles').doc(uid).update({bloqueado: bloquear});
  alert(bloquear ? "Usuario bloqueado permanentemente." : "Usuario desbloqueado.");
}
</script>
</body>
</html>

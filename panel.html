<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Panel Master - Dueño Absoluto</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap');
  body{background-color:#09090b;color:#f4f4f5;font-family:'Plus Jakarta Sans',sans-serif}
  h1,h2,h3,h4{font-family:'Outfit',sans-serif}
  .web-panel{background:rgba(18,18,24,0.95);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.07);box-shadow:0 20px 50px rgba(0,0,0,0.6)}
</style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

<div class="max-w-4xl w-full space-y-6">
  <div class="web-panel rounded-3xl p-6 border border-yellow-500/30 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-yellow-500 text-zinc-950 flex items-center justify-center text-2xl font-black shadow-lg"><i class="fas fa-crown"></i></div>
      <div>
        <h2 class="text-lg font-black text-white">Panel Master del Dueño</h2>
        <p class="text-xs text-zinc-400">Control total y revisiones detalladas</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleMiVipDueño()" class="bg-yellow-500 hover:bg-yellow-400 text-zinc-950 font-black px-4 py-2.5 rounded-xl text-xs uppercase shadow transition">👑 Activar/Desactivar Mi VIP</button>
      <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition"><i class="fas fa-arrow-left mr-1.5"></i> Volver</a>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="web-panel rounded-3xl p-6 space-y-4 border border-zinc-800">
      <h3 class="text-xs font-bold text-yellow-400 uppercase"><i class="fas fa-palette mr-1.5"></i> Temáticas Notorias</h3>
      <div class="grid grid-cols-2 gap-2.5 text-xs">
        <button onclick="cambiarTematicaGlobal('default')" class="p-3 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-yellow-500 text-white font-bold transition">🌌 Normal</button>
        <button onclick="cambiarTematicaGlobal('halloween')" class="p-3 rounded-xl bg-zinc-900 border border-orange-500/40 text-orange-400 font-bold transition">🎃 Halloween</button>
        <button onclick="cambiarTematicaGlobal('navidad')" class="p-3 rounded-xl bg-zinc-900 border border-rose-500/40 text-rose-400 font-bold transition">🎄 Navidad</button>
        <button onclick="cambiarTematicaGlobal('verano')" class="p-3 rounded-xl bg-zinc-900 border border-cyan-500/40 text-cyan-400 font-bold transition">☀️ Verano</button>
      </div>
    </div>

    <div class="web-panel rounded-3xl p-6 space-y-4 border border-rose-500/30">
      <h3 class="text-xs font-bold text-rose-400 uppercase"><i class="fas fa-tools mr-1.5"></i> Mantenimiento & Aviso Emergente</h3>
      <div class="flex gap-2">
        <button onclick="toggleModoMantenimiento(true)" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-black py-2.5 rounded-xl uppercase text-xs shadow">Activar Mantención (2h)</button>
        <button onclick="toggleModoMantenimiento(false)" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-black py-2.5 rounded-xl uppercase text-xs shadow">Apagar</button>
      </div>
      <button onclick="toggleAvisoMantenimiento(true)" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase shadow">📢 Activar Aviso de Mantención</button>
      <button onclick="toggleAvisoMantenimiento(false)" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2 rounded-xl text-xs uppercase">🔕 Desactivar Aviso de Mantención</button>
    </div>
  </div>

  <!-- SOLICITUDES DE POSTULACIÓN CON DETALLE -->
  <div class="web-panel rounded-3xl p-6 space-y-4 border border-yellow-500/30">
    <h3 class="text-xs font-bold text-yellow-400 uppercase"><i class="fas fa-id-card mr-1.5"></i> Solicitudes de Postulación (Pincha para ver detalles)</h3>
    <div id="admin-postulaciones-list" class="space-y-3 text-xs"><p class="text-zinc-500">Cargando postulaciones...</p></div>
  </div>

  <div class="web-panel rounded-3xl p-6 space-y-4 border border-zinc-800">
    <h3 class="text-xs font-bold text-yellow-400 uppercase"><i class="fas fa-users mr-1.5"></i> Gestión de Usuarios</h3>
    <div id="admin-usuarios-list" class="space-y-2 text-xs"><p class="text-zinc-500">Cargando usuarios...</p></div>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD4PyR975err3q8gPX6JOwpnnM5MXnA5C8",authDomain:"siilckventasfull.firebaseapp.com",projectId:"siilckventasfull",storageBucket:"siilckventasfull.firebasestorage.app",messagingSenderId:"1081229515356",appId:"1:1081229515356:web:78ccc9fb4053ee54072499"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const OWNER_UID="YwjfajkyMXMRHd18eII4dwV03NF3";

auth.onAuthStateChanged(async(u)=>{
  if(!u || u.uid !== OWNER_UID){
    alert("Acceso exclusivo para el dueño.");
    window.location.href="index.html";
    return;
  }
  cargarPanelControl();
});

async function cambiarTematicaGlobal(tema){
  await db.collection('configuracion').doc('global').set({tematica: tema}, {merge: true});
  alert("✅ Temática aplicada: " + tema.toUpperCase());
}

async function toggleModoMantenimiento(estado){
  const tiempoFin = estado ? new Date().getTime() + (2 * 60 * 60 * 1000) : null;
  await db.collection('configuracion').doc('global').set({mantenimientoActivo: estado, mantenimientoFin: tiempoFin}, {merge: true});
  alert(estado ? "🛠️ Mantenimiento activado." : "⚡ Mantenimiento desactivado.");
}

async function toggleAvisoMantenimiento(estado){
  const texto = estado ? "Atención: La plataforma entrará en mantenimiento programado pronto." : "";
  await db.collection('configuracion').doc('global').set({avisoMantenimiento: texto}, {merge: true});
  alert(estado ? "📢 Aviso de mantención activado." : "🔕 Aviso de mantención desactivado.");
}

async function toggleMiVipDueño(){
  const ref = db.collection('perfiles').doc(OWNER_UID);
  const doc = await ref.get();
  const actual = doc.exists ? doc.data().esVendedorVip : false;
  const nuevoEstado = !actual;
  const unAnoDespues = new Date(new Date().getTime() + 365 * 24 * 60 * 60 * 1000);
  
  await ref.set({
    esVendedorVip: nuevoEstado,
    vipExpira: nuevoEstado ? firebase.firestore.Timestamp.fromDate(unAnoDespues) : null
  }, {merge: true});
  alert(nuevoEstado ? "👑 ¡Tu Plan VIP de Dueño ha sido Activado!" : "Tu Plan VIP ha sido Desactivado.");
}

async function cargarPanelControl(){
  db.collection('postulaciones_vendedores').onSnapshot(snapshot => {
    let h = "";
    snapshot.forEach(doc => {
      const p = doc.data();
      const estado = p.estado || 'pendiente';
      if(estado === 'pendiente'){
        const fotoHtml = p.fotoReferencia ? `<div class="mt-3"><span class="text-[10px] font-bold text-yellow-400 block mb-1">Foto / Captura adjunta:</span><div class="w-32 h-32 rounded-xl overflow-hidden bg-zinc-950 border border-zinc-800"><img src="${p.fotoReferencia}" class="w-full h-full object-cover"></div></div>` : '<span class="text-zinc-500 block mt-2">Sin foto adjunta.</span>';
        
        h += `<div class="bg-zinc-900 p-4 rounded-2xl border border-yellow-500/30 space-y-3">
          <div class="flex items-center justify-between cursor-pointer" onclick="document.getElementById('detalle-${doc.id}').classList.toggle('hidden')">
            <div>
              <b class="text-white text-sm">${p.nombre || 'Sin Nombre'} ${p.apellido || ''}</b> (@ UID: ${p.uid})
              <span class="text-[10px] text-zinc-400 block">Toca para desplegar y ver detalles completos</span>
            </div>
            <span class="bg-yellow-500/20 text-yellow-400 px-3 py-1.5 rounded-xl font-bold">Ver Detalles 👁️</span>
          </div>
          
          <div id="detalle-${doc.id}" class="hidden space-y-2.5 pt-3 border-t border-zinc-800 text-zinc-300">
            <p><b>¿Qué le motiva?:</b> ${p.motivacion || 'N/A'}</p>
            <p><b>Experiencia:</b> ${p.experiencia || 'N/A'}</p>
            <p><b>Contacto:</b> <span class="text-yellow-400 font-mono">${p.contacto || 'N/A'}</span></p>
            ${fotoHtml}
          </div>

          <div class="flex gap-2 pt-2 border-t border-zinc-800">
            <button onclick="aprobarVendedor('${p.uid}', '${doc.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl">Aprobar Vendedor</button>
            <button onclick="rechazarVendedor('${doc.id}')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded-xl">Rechazar</button>
          </div>
        </div>`;
      }
    });
    document.getElementById('admin-postulaciones-list').innerHTML = h || '<p class="text-zinc-500">No hay postulaciones pendientes.</p>';
  });

  db.collection('perfiles').onSnapshot(snapshot => {
    let h = "";
    snapshot.forEach(doc => {
      const u = doc.data();
      const bloqueado = u.bloqueado ? `<span class="text-rose-400 font-bold">Bloqueado 🚫</span>` : `<span class="text-emerald-400">Activo ✅</span>`;
      const btnAccion = u.bloqueado ? `<button onclick="toggleBloqueoUser('${doc.id}', false)" class="bg-emerald-600 text-white px-3 py-1 rounded-lg">Desbloquear</button>` : `<button onclick="toggleBloqueoUser('${doc.id}', true)" class="bg-rose-600 text-white px-3 py-1 rounded-lg">Bloquear</button>`;
      
      h += `<div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-2">
        <div>
          <b class="text-white">@${u.username || 'Gamer'}</b> ${u.postuladoFormulario ? '⭐ Vendedor' : ''}
          <span class="text-[10px] text-zinc-400 block font-mono">ID: ${u.uid}</span>
        </div>
        <div class="flex items-center gap-3">
          ${bloqueado}
          ${u.uid !== OWNER_UID ? btnAccion : ''}
        </div>
      </div>`;
    });
    document.getElementById('admin-usuarios-list').innerHTML = h || '<p class="text-zinc-500">No hay usuarios.</p>';
  });
}

async function aprobarVendedor(uidUser, formId){
  await db.collection('perfiles').doc(uidUser).update({postuladoFormulario: true});
  await db.collection('postulaciones_vendedores').doc(formId).update({estado: 'aprobado'});
  alert("✅ ¡Vendedor aprobado!");
}

async function rechazarVendedor(formId){
  await db.collection('postulaciones_vendedores').doc(formId).update({estado: 'rechazado'});
  alert("Solicitud rechazada.");
}

async function toggleBloqueoUser(uid, estado){
  await db.collection('perfiles').doc(uid).update({bloqueado: estado});
  alert(estado ? "Usuario bloqueado." : "Desbloqueado.");
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Autenticación - SiilckVentas</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap');
  body{background-color:#09090b;color:#f4f4f5;font-family:'Plus Jakarta Sans',sans-serif}
  h1,h2,h3,h4{font-family:'Outfit',sans-serif}
  .web-panel{background:rgba(18,18,24,0.95);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.07);box-shadow:0 20px 50px rgba(0,0,0,0.6)}
</style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

<div class="max-w-md w-full web-panel rounded-3xl p-8 space-y-6 border border-yellow-500/30">
  <div class="text-center space-y-2">
    <div class="w-14 h-14 rounded-2xl bg-yellow-500 text-zinc-950 flex items-center justify-center text-2xl font-black mx-auto shadow-lg"><i class="fas fa-user-lock"></i></div>
    <h2 class="text-xl font-black text-white" id="auth-title">Acceso o Registro Gamer</h2>
    <p class="text-xs text-zinc-400">Verificación de correo electrónico requerida</p>
  </div>

  <div class="space-y-4 text-xs">
    <div><label class="block text-[10px] uppercase font-bold text-zinc-300 mb-1">Correo Electrónico *</label><input type="email" id="auth-email" placeholder="tucorreo@gmail.com" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500"></div>
    <div><label class="block text-[10px] uppercase font-bold text-zinc-300 mb-1">Contraseña *</label><input type="password" id="auth-pass" placeholder="••••••••" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500"></div>
    
    <div class="flex gap-2 pt-2">
      <button onclick="iniciarSesionEmail()" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-zinc-950 font-black py-3.5 rounded-xl uppercase shadow">Iniciar Sesión</button>
      <button onclick="registrarUsuarioEmail()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-black py-3.5 rounded-xl uppercase shadow">Registrarse</button>
    </div>
    
    <div class="text-center pt-2">
      <a href="index.html" class="text-xs text-zinc-400 underline">← Volver al Marketplace</a>
    </div>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD4PyR975err3q8gPX6JOwpnnM5MXnA5C8",authDomain:"siilckventasfull.firebaseapp.com",projectId:"siilckventasfull",storageBucket:"siilckventasfull.firebasestorage.app",messagingSenderId:"1081229515356",appId:"1:1081229515356:web:78ccc9fb4053ee54072499"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();

async function registrarUsuarioEmail(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value.trim();
  if(!email || !pass){alert("Ingresa correo y contraseña.");return;}
  
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    // Enviar correo de verificación real a Gmail del usuario
    await cred.user.sendEmailVerification();
    
    // Crear perfil inicial
    await db.collection('perfiles').doc(cred.user.uid).set({
      uid: cred.user.uid,
      username: email.split('@')[0],
      email: email,
      postuladoFormulario: false,
      esVendedorVip: false,
      bloqueado: false,
      logo: "👑",
      fecha: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("✅ Registro exitoso. ¡Te hemos enviado un correo de verificación real a tu bandeja de Gmail!");
    window.location.href = "index.html";
  }catch(e){
    alert("Error al registrarse: " + e.message);
  }
}

async function iniciarSesionEmail(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value.trim();
  if(!email || !pass){alert("Ingresa correo y contraseña.");return;}

  try{
    await auth.signInWithEmailAndPassword(email, pass);
    window.location.href = "index.html";
  }catch(e){
    alert("Error al iniciar sesión: " + e.message);
  }
}
</script>
</body>
</html>

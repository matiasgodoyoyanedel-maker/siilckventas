<script>
const firebaseConfig={apiKey:"AIzaSyD4PyR975err3q8gPX6JOwpnnM5MXnA5C8",authDomain:"[REDACTED].firebaseapp.com",projectId:"[REDACTED]",storageBucket:"[REDACTED].firebasestorage.app",messagingSenderId:"1081229515356",appId:"1:1081229515356:web:78ccc9fb4053ee54072499"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
function origenPublico(){
  const h=String(location.hostname||'');
  if(/\.vercel\.app$/i.test(h) && !/^siilckventas\.vercel\.app$/i.test(h)) return 'https://www.siiilckventas.com';
  return String(location.origin||'https://www.siiilckventas.com').replace(/\/$/,'');
}
function urlCuentaPublica(id){
  const limpio=String(id||'').trim();
  if(!limpio || limpio==='[id]' || limpio.indexOf('[')>=0 || limpio.indexOf(']')>=0) return '';
  return origenPublico()+'/cuenta/'+encodeURIComponent(limpio);
}
function idCuenta(){
  const q=new URLSearchParams(location.search);
  const directo=q.get('id')||q.get('cuenta');
  if(directo) return directo;
  const partes=location.pathname.split('/').filter(Boolean);
  const i=partes.indexOf('cuenta');
  return i>=0 && partes[i+1] ? decodeURIComponent(partes[i+1]) : '';
}
const pubId=idCuenta();
let publicacion=null;
let fichaLista=false;
let yaEnCarrito=false;
let agregandoFicha=false;
let timerToastCarrito=null;
function precioVisible(n){
  if(window.SiilckSettings) return SiilckSettings.formatPrice(n);
  return '$'+Number(n||0).toLocaleString('es-CL');
}
function precioCobro(){
  const base=Number(publicacion && publicacion.precio)||0;
  if(window.getOferta){
    const oferta=getOferta(base, publicacion);
    if(oferta && oferta.ahora>=1) return oferta.ahora;
  }
  return base;
}
function garantiaElegida(){
  const radio=document.querySelector('input[name="garantia-ficha"]:checked');
  return {
    costo: radio ? parseInt(radio.value,10)||0 : 0,
    label: radio && radio.getAttribute('data-label') ? radio.getAttribute('data-label') : 'Garantía 10 días'
  };
}
function pintarTotal(){
  if(!publicacion) return;
  document.getElementById('total').textContent=precioVisible(precioCobro()+garantiaElegida().costo);
  const oferta=window.getOferta ? getOferta(Number(publicacion.precio)||0, publicacion) : null;
  const box=document.getElementById('oferta');
  if(oferta){
    box.classList.remove('hidden');
    box.textContent='🔥 ¡OFERTA ACTIVA! Te ahorras '+precioVisible(oferta.ahorro)+' (-'+oferta.descuento+'%)';
  }
}
function reputacionDeFicha(p){
  const extra=(p && p._reputacion) || {};
  if(Number(extra.totalResenas)>0) return extra;
  const total=Number(p && p.resenasTotal)||0;
  if(total>0) return { promedio:Number(p.resenasPromedio)||0, totalResenas:total, ventasCompletadas:Number(extra.ventasCompletadas)||0, resenas:p.resenasRecientes||extra.resenas||[] };
  return extra;
}
function pintarResenasFicha(rep){
  const box=document.getElementById('resenas-ficha');
  if(!box) return;
  box.textContent='';
  const lista=(rep && rep.resenas)||[];
  lista.forEach((r)=>{
    const n=Math.max(1, Math.min(5, Math.round(Number(r.estrellas)||0)));
    const fila=document.createElement('p');
    fila.className='text-[11px] text-zinc-300';
    fila.textContent='★'.repeat(n)+'☆'.repeat(5-n)+' '+(r.comentario||'');
    box.appendChild(fila);
  });
}
async function salesPorApi(uid){
  if(!uid) return null;
  try{
    const res=await fetch('/api/vendedor?uid='+encodeURIComponent(uid));
    const json=await res.json();
    if(res.ok && json && json.ok && json.vendedor && json.vendedor.salesCount != null) return Number(json.vendedor.salesCount)||0;
  }catch(e){}
  return null;
}
function textoRep(rep){
  const total=Number(rep && rep.totalResenas)||0;
  const prom=Number(rep && rep.promedio)||0;
  const ventas=rep && rep.salesCount != null ? (Number(rep.salesCount)||0) : 0;
  const etiqueta=ventas===1?'venta':'ventas';
  if(!total) return 'Nuevo · '+ventas+' '+etiqueta;
  const llenas=Math.round(Math.max(0, Math.min(5, prom)));
  return '★'.repeat(llenas)+'☆'.repeat(5-llenas)+' '+prom.toFixed(1)+' ('+total+') · '+ventas+' '+etiqueta;
}
function chip(texto){
  const s=document.createElement('span');
  s.className='bg-zinc-900 px-2.5 py-1 rounded text-zinc-200';
  s.textContent=texto;
  return s;
}
function exigirLogin(){
  if(auth.currentUser) return true;
  localStorage.setItem('redirect_after_login', location.pathname+location.search);
  location.href='/login.html';
  return false;
}
function mostrarToastYaCarrito(){
  const t=document.getElementById('toast-ya-carrito');
  if(!t) return;
  t.classList.remove('hidden');
  t.classList.add('flex');
  clearTimeout(timerToastCarrito);
  timerToastCarrito=setTimeout(cerrarToastYaCarrito, 3000);
}
function cerrarToastYaCarrito(){
  const t=document.getElementById('toast-ya-carrito');
  if(!t) return;
  t.classList.add('hidden');
  t.classList.remove('flex');
  clearTimeout(timerToastCarrito);
}
function pintarBotonCarritoFicha(){
  const btn=document.getElementById('btn-carrito');
  if(!btn) return;
  btn.disabled=yaEnCarrito;
  if(yaEnCarrito){
    btn.className='bg-zinc-600 text-zinc-300 font-extrabold px-5 py-3 rounded-xl text-xs uppercase cursor-not-allowed';
    btn.innerHTML='En carrito';
  }else{
    btn.className='bg-yellow-500 text-zinc-950 font-extrabold px-5 py-3 rounded-xl text-xs uppercase';
    btn.innerHTML='<i class="fas fa-cart-plus mr-1"></i> Agregar al Carrito';
  }
}
async function marcarSiEstaEnCarrito(){
  const user=auth.currentUser;
  if(!user || !pubId){ yaEnCarrito=false; pintarBotonCarritoFicha(); return; }
  try{
    const q=await db.collection('carritos').doc(user.uid).collection('items').where('publicacionId','==',pubId).get();
    yaEnCarrito=q.docs.some(d => (d.data()||{}).tipoItem !== 'pase_vip');
  }catch(e){}
  pintarBotonCarritoFicha();
}
function uidVendedor(p){
  return (p && (p.vendedorUid || p.ownerId || p.userId)) || '';
}
async function pintarVendedorVivo(p){
  const uid=uidVendedor(p);
  const embebido=(p && p._vendedor) || {};
  let data={};
  try{
    if(uid){
      const doc=await db.collection('perfiles').doc(uid).get();
      data=doc.exists ? (doc.data()||{}) : {};
    }
  }catch(e){}
  if(!String(data.displayName || data.username || '').trim()){
    data={ ...embebido, ...data, displayName: data.displayName || embebido.displayName || '', username: data.username || embebido.username || '', avatar_url: data.avatar_url || embebido.avatar || embebido.avatar_url || '', foto: data.foto || embebido.foto || '' };
  }
  const nombre=String(data.displayName || data.username || '').trim() || 'Vendedor';
  document.getElementById('vendedor').textContent=nombre;
  const logo=document.getElementById('logo');
  const inicial=(nombre.charAt(0)||'V').toUpperCase();
  const avatar=/^(https?:|data:image\/)/.test(data.avatar_url||'') ? data.avatar_url : (/^(https?:|data:image\/)/.test(data.foto||'') ? data.foto : '');
  logo.className='w-12 h-12 rounded-full bg-yellow-500 text-zinc-950 flex items-center justify-center font-black text-lg overflow-hidden shrink-0';
  logo.textContent='';
  if(/^(https?:|data:image\/)/.test(avatar)){
    const img=document.createElement('img');
    img.src=avatar;
    img.alt='';
    img.className='w-full h-full object-cover';
    img.onerror=()=>{ logo.textContent=inicial; };
    logo.appendChild(img);
  }else{
    logo.textContent=inicial;
  }
  document.getElementById('link-vendedor').href='/vendedor/'+encodeURIComponent(uid);
}
async function guardarLineaCarrito(){
  const user=auth.currentUser;
  if(!user || !publicacion) return;
  const g=garantiaElegida();
  const cobro=precioCobro();
  const payload={
    tipoItem:'cuenta',
    publicacionId:pubId,
    titulo:publicacion.titulo||'Cuenta',
    precio:cobro+g.costo,
    precioBase:Number(publicacion.precio)||0,
    precioFinal:cobro,
    garantia:g.costo,
    garantiaCosto:g.costo,
    garantiaLabel:g.label,
    stock:publicacion.stock==null?1:Number(publicacion.stock),
    foto:publicacion.foto||'',
    cantidadSeleccionada:1,
    ofertaActiva:publicacion.ofertaActiva===true,
    ofertaDescuento:Number(publicacion.ofertaDescuento)||0,
    agregadoEn:firebase.firestore.FieldValue.serverTimestamp()
  };
  const ref=db.collection('carritos').doc(user.uid).collection('items');
  const q=await ref.where('publicacionId','==',pubId).get();
  if(q.empty) await ref.add(payload);
  else {
    for(const doc of q.docs) await doc.ref.set(payload, { merge:true });
  }
}
async function pagar(ruta, btn){
  if(!exigirLogin()) return;
  const etiqueta=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-spinner fa-spin mr-1"></i> Conectando...';
  try{
    await guardarLineaCarrito();
    const token=await auth.currentUser.getIdToken(true);
    const res=await fetch(ruta, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token },
      body: JSON.stringify({ listingId: pubId, email: auth.currentUser.email })
    });
    const json=await res.json();
    if(!res.ok){ alert(json.error||'No se pudo iniciar el pago.'); return; }
    location.href=json.url;
  }catch(err){
    alert(err.message);
  }
  btn.disabled=false;
  btn.innerHTML=etiqueta;
}
async function pintarFicha(p){
  publicacion=p;
  document.title=(p.titulo||'Cuenta')+' - SiilckVentas';
  document.getElementById('estado').textContent='';
  document.getElementById('ficha').classList.remove('hidden');
  document.getElementById('titulo').textContent=p.titulo||'Cuenta';
  document.getElementById('descripcion').textContent=p.descripcion||'Sin descripción.';
  pintarVendedorVivo(p);
  const tags=document.getElementById('tags');
  tags.textContent='';
  tags.appendChild(chip(p.juego||'Juego'));
  if(p.nivel) tags.appendChild(chip('Nivel: '+p.nivel));
  if(p.rango) tags.appendChild(chip('Rango: '+p.rango));
  if(p.region) tags.appendChild(chip(p.region));
  if(p.entregaInmediata!==false) tags.appendChild(chip('Entrega inmediata'));
  const foto=document.getElementById('foto');
  const fotoBox=document.getElementById('foto-box');
  if(p.foto){ foto.src=p.foto; fotoBox.classList.remove('hidden'); }
  pintarTotal();
  marcarSiEstaEnCarrito();
  const local=reputacionDeFicha(p);
  try{
    const rep=await db.collection('reputacion').doc(uidVendedor(p)||p.vendedorUid||'x').get();
    const viva=rep.exists?rep.data():{};
    const elegida=Number(viva && viva.totalResenas)>0 ? { ...viva } : (Number(local.totalResenas)>0 ? { ...local } : { ...(viva||{}), ...(local||{}) });
    if(local && local.salesCount != null) elegida.salesCount=local.salesCount;
    if(elegida.salesCount == null){
      const uidRep=uidVendedor(p);
      try{
        const users=await db.collection('users').doc(uidRep||'x').get();
        if(users.exists && users.data() && users.data().salesCount != null) elegida.salesCount=Number(users.data().salesCount)||0;
      }catch(e){}
      if(elegida.salesCount == null){
        try{
          const perfil=await db.collection('perfiles').doc(uidRep||'x').get();
          if(perfil.exists && perfil.data() && perfil.data().salesCount != null) elegida.salesCount=Number(perfil.data().salesCount)||0;
        }catch(e){}
      }
      if(elegida.salesCount == null){
        const porApi=await salesPorApi(uidRep);
        if(porApi != null) elegida.salesCount=porApi;
      }
    }
    document.getElementById('reputacion').textContent=textoRep(elegida);
    pintarResenasFicha(local.resenas && local.resenas.length ? local : elegida);
  }catch(e){
    if(local.salesCount == null){
      const uidRep=uidVendedor(p);
      try{
        const perfil=await db.collection('perfiles').doc(uidRep||'x').get();
        if(perfil.exists && perfil.data() && perfil.data().salesCount != null) local.salesCount=Number(perfil.data().salesCount)||0;
      }catch(e){}
      if(local.salesCount == null){
        const porApi=await salesPorApi(uidRep);
        if(porApi != null) local.salesCount=porApi;
      }
    }
    document.getElementById('reputacion').textContent=textoRep(local);
    pintarResenasFicha(local);
  }
}
async function cargarFichaPorServidor(){
  const res=await fetch('/api/ficha?id='+encodeURIComponent(pubId));
  const json=await res.json().catch(()=>null);
  if(!json || !json.ok || !json.publicacion){
    const msg=(json && json.error)||'';
    if(msg==='Falta el enlace de la cuenta.') throw new Error(msg);
    document.getElementById('estado').textContent='Cuenta no encontrada';
    fichaLista=true;
    return;
  }
  const p=json.publicacion;
  p._vendedor=json.vendedor||null;
  p._reputacion=json.reputacion||null;
  fichaLista=true;
  await pintarFicha(p);
  const stock=p.stock==null?1:Number(p.stock);
  if(p.vendida || stock<=0) document.getElementById('estado').textContent='Esta cuenta ya se vendió. La ficha queda visible como referencia.';
}
document.querySelectorAll('input[name="garantia-ficha"]').forEach((el)=>el.addEventListener('change', pintarTotal));
document.addEventListener('siilck-settings', pintarTotal);
document.addEventListener('siilck-oferta-ready', pintarTotal);
document.getElementById('btn-copiar').addEventListener('click', async ()=>{
  const url=(typeof urlCuentaPublica==='function'?urlCuentaPublica(pubId): (location.origin+'/cuenta/'+encodeURIComponent(pubId)));
  if(!url) return;
  try{ await navigator.clipboard.writeText(url); document.getElementById('btn-copiar').textContent='Enlace copiado'; }
  catch(e){ document.getElementById('btn-copiar').textContent=url; }
});
document.getElementById('btn-carrito').addEventListener('click', async ()=>{
  if(!exigirLogin()) return;
  if(yaEnCarrito || agregandoFicha){
    mostrarToastYaCarrito();
    return;
  }
  agregandoFicha=true;
  try{
    await marcarSiEstaEnCarrito();
    if(yaEnCarrito){
      mostrarToastYaCarrito();
      return;
    }
    const stock=publicacion && (publicacion.stock==null ? 1 : Number(publicacion.stock));
    if(!(stock>=1)){
      alert('Esta cuenta no tiene unidades disponibles.');
      return;
    }
    await guardarLineaCarrito();
    yaEnCarrito=true;
    pintarBotonCarritoFicha();
    location.href='carrito.html';
  }catch(err){
    yaEnCarrito=false;
    pintarBotonCarritoFicha();
    alert((err && err.message) || 'No se pudo agregar al carrito.');
  }finally{
    agregandoFicha=false;
  }
});
auth.onAuthStateChanged(()=>{ marcarSiEstaEnCarrito(); });
document.getElementById('btn-flow').addEventListener('click', ()=>pagar('/api/flow/create', document.getElementById('btn-flow')));
document.getElementById('btn-mp').addEventListener('click', ()=>pagar('/api/mp/create', document.getElementById('btn-mp')));
document.getElementById('btn-chat').addEventListener('click', async ()=>{
  if(!exigirLogin() || !publicacion) return;
  if(auth.currentUser.uid===publicacion.vendedorUid) return;
  const chats=db.collection('chats_p2p');
  const q=await chats.where('publicacionId','==',pubId).where('compradorUid','==',auth.currentUser.uid).get();
  let chatId=q.empty ? '' : q.docs[0].id;
  if(!chatId){
    const nuevo=await chats.add({
      publicacionId:pubId,
      compradorUid:auth.currentUser.uid,
      vendedorUid:publicacion.vendedorUid,
      chatCerrado:false,
      actualizadoEn:firebase.firestore.FieldValue.serverTimestamp()
    });
    chatId=nuevo.id;
  }
  location.href='ventas.html?chat='+encodeURIComponent(chatId);
});
if(!pubId) document.getElementById('estado').textContent='Falta el enlace de la cuenta.';
else {
  const respaldo=setTimeout(()=>{ if(!fichaLista) cargarFichaPorServidor().catch(()=>{}); }, 2500);
  db.collection('publicaciones').doc(pubId).get().then((doc)=>{
    clearTimeout(respaldo);
    fichaLista=true;
    if(!doc.exists){ document.getElementById('estado').textContent='Cuenta no encontrada'; return; }
    const p=doc.data()||{};
    const stock=p.stock==null?1:Number(p.stock);
    pintarFicha({ id:doc.id, ...p });
    if(p.vendida || stock<=0) document.getElementById('estado').textContent='Esta cuenta ya se vendió. La ficha queda visible como referencia.';
  }).catch(()=>{
    clearTimeout(respaldo);
    cargarFichaPorServidor().catch(()=>{
      if(!fichaLista) document.getElementById('estado').textContent='No se pudo cargar la ficha.';
    });
  });
}
</script>

<!DOCTYPE html>
<html lang="es" data-sv-theme="aurora">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos de tu cuenta - SiilckVentas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/tema.css">
<script src="/tema.js"></script>
<style>
  body{background:#050014;color:#f4f4f5;font-family:'Plus Jakarta Sans',sans-serif}
  h1,h2{font-family:'Outfit',sans-serif}
  .web-panel{background:rgba(18,18,24,.95);border:1px solid rgba(255,255,255,.07)}
</style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex justify-center">
  <div class="max-w-lg w-full space-y-4">
    <a href="/index.html" class="text-xs text-zinc-400 hover:text-white"><i class="fas fa-arrow-left mr-1"></i> Inicio</a>
    <div class="web-panel rounded-3xl p-6 space-y-2 border border-yellow-500/30">
      <h1 class="text-xl font-black text-white">Datos de tu cuenta</h1>
      <p id="estado" class="text-xs text-zinc-400">Cargando la compra…</p>
    </div>
    <div id="lista" class="space-y-3"></div>
    <div id="calificacion" class="web-panel rounded-3xl p-5 space-y-3 border border-yellow-500/30 hidden"></div>
  </div>
<script>
const firebaseConfig={apiKey:"AIzaSyD4PyR975err3q8gPX6JOwpnnM5MXnA5C8",authDomain:"[REDACTED].firebaseapp.com",projectId:"[REDACTED]",storageBucket:"[REDACTED].firebasestorage.app",messagingSenderId:"1081229515356",appId:"1:1081229515356:web:78ccc9fb4053ee54072499"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

function orderId(){
  const q=new URLSearchParams(location.search);
  const directo=q.get('order_id')||q.get('id');
  if(directo) return directo;
  const partes=location.pathname.split('/').filter(Boolean);
  const i=partes.indexOf('mis-compras');
  return i>=0&&partes[i+1]?decodeURIComponent(partes[i+1]):'';
}
const id=orderId();
const estado=document.getElementById('estado');
const lista=document.getElementById('lista');

function fila(etiqueta, valor){
  const box=document.createElement('div');
  box.className='flex items-center justify-between gap-3 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2';
  const texto=document.createElement('div');
  const k=document.createElement('p');
  k.className='text-[10px] uppercase text-zinc-500 font-bold';
  k.textContent=etiqueta;
  const v=document.createElement('p');
  v.className='text-sm text-yellow-400 font-bold break-all';
  v.textContent=valor||'No indicado';
  texto.appendChild(k); texto.appendChild(v);
  const btn=document.createElement('button');
  btn.type='button';
  btn.className='shrink-0 bg-zinc-800 text-white text-[10px] font-bold px-3 py-2 rounded-lg';
  btn.textContent='Copiar';
  btn.addEventListener('click', async()=>{
    try{ await navigator.clipboard.writeText(valor||''); btn.textContent='Copiado'; }
    catch(e){ btn.textContent='Selecciona el texto'; }
  });
  box.appendChild(texto); box.appendChild(btn);
  return box;
}

function pintar(cuentas){
  lista.textContent='';
  if(!cuentas.length){
    estado.textContent='El pago está confirmado, pero esta orden no tiene datos de cuenta cargados por el vendedor.';
    return;
  }
  estado.textContent='Solo tú puedes ver esto. El anuncio público no muestra la clave.';
  cuentas.forEach(cuenta=>{
    const card=document.createElement('article');
    card.className='web-panel rounded-3xl p-5 space-y-3 border border-emerald-500/30';
    const h=document.createElement('h2');
    h.className='text-sm font-black text-white';
    h.textContent=cuenta.titulo||'Cuenta';
    card.appendChild(h);
    const meta=[cuenta.juego, cuenta.nivel, cuenta.region].filter(Boolean).join(' · ');
    const nota=document.createElement('p');
    nota.className='text-[11px] text-zinc-400';
    nota.textContent=meta ? ('Publicación vendida · '+meta) : 'Estos son los datos de esta publicación.';
    card.appendChild(nota);
    card.appendChild(fila('Usuario', cuenta.usuario || cuenta.email));
    card.appendChild(fila('Correo asociado', cuenta.email));
    card.appendChild(fila('Clave', cuenta.clave));
    card.appendChild(fila('Teléfono', cuenta.telefono));
    card.appendChild(fila('Recuperación', cuenta.recuperacion));
    if(cuenta.instrucciones) card.appendChild(fila('Instrucciones', cuenta.instrucciones));
    lista.appendChild(card);
  });
}

function pintarCalificacion(review){
  const box=document.getElementById('calificacion');
  if(!box) return;
  box.classList.remove('hidden');
  box.textContent='';
  const titulo=document.createElement('h2');
  titulo.className='text-sm font-black text-white';
  titulo.textContent='Calificación de esta compra';
  box.appendChild(titulo);
  if(review){
    const fija=document.createElement('p');
    fija.className='text-sm text-yellow-400 font-bold';
    fija.textContent='Ya calificaste con '+review.rating+' estrellas';
    const comentario=document.createElement('p');
    comentario.className='text-sm text-zinc-200';
    comentario.textContent='Tu comentario: '+(review.comment||'');
    const aviso=document.createElement('p');
    aviso.className='text-[11px] text-zinc-400';
    aviso.textContent='Esta calificación es definitiva y no se puede modificar';
    box.appendChild(fija); box.appendChild(comentario); box.appendChild(aviso);
    return;
  }
  let elegida=0;
  const estrellas=document.createElement('div');
  estrellas.className='flex gap-2';
  for(let n=1;n<=5;n++){
    const b=document.createElement('button');
    b.type='button';
    b.className='text-2xl text-zinc-600';
    b.textContent='★';
    b.setAttribute('aria-label', n+' estrellas');
    b.addEventListener('click', ()=>{
      elegida=n;
      [...estrellas.children].forEach((el,i)=>{ el.className='text-2xl '+(i<n?'text-yellow-400':'text-zinc-600'); });
    });
    estrellas.appendChild(b);
  }
  const input=document.createElement('textarea');
  input.rows=3;
  input.placeholder='Cuéntale al vendedor cómo te fue';
  input.className='w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white';
  const enviar=document.createElement('button');
  enviar.type='button';
  enviar.className='w-full bg-yellow-500 text-zinc-950 font-black py-3 rounded-xl text-xs uppercase';
  enviar.textContent='Enviar Calificación';
  const aviso=document.createElement('p');
  aviso.className='text-[11px] text-rose-300 hidden';
  enviar.addEventListener('click', async()=>{
    aviso.classList.add('hidden');
    if(!elegida){ aviso.textContent='Elige de 1 a 5 estrellas.'; aviso.classList.remove('hidden'); return; }
    if(!input.value.trim()){ aviso.textContent='Escribe un comentario.'; aviso.classList.remove('hidden'); return; }
    enviar.disabled=true;
    try{
      const token=await auth.currentUser.getIdToken(true);
      const res=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({order_id:id,rating:elegida,comment:input.value.trim()})});
      const data=await res.json();
      if(!res.ok){ aviso.textContent=data.error||'No se pudo enviar.'; aviso.classList.remove('hidden'); enviar.disabled=false; return; }
      pintarCalificacion(data.review);
    }catch(e){
      aviso.textContent='No se pudo enviar la calificación.';
      aviso.classList.remove('hidden');
      enviar.disabled=false;
    }
  });
  box.appendChild(estrellas); box.appendChild(input); box.appendChild(enviar); box.appendChild(aviso);
}
async function cargarCompra(user){
  try{
    const token=await user.getIdToken(true);
    const res=await fetch('/api/compra?datos=1&order_id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});
    const data=await res.json();
    if(!res.ok){ estado.textContent=data.error||'No se pudieron mostrar los datos.'; return; }
    pintar(data.cuentas||[]);
    const rev=await fetch('/api/reviews?order_id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});
    const revData=await rev.json();
    if(rev.ok) pintarCalificacion(revData.review||null);
  }catch(e){
    estado.textContent='No se pudieron cargar los datos. Reintenta en unos segundos.';
  }
}
let compraLista=false;
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
auth.onAuthStateChanged(async(user)=>{
  if(!id){ estado.textContent='Falta el número de la compra.'; return; }
  if(user){
    if(compraLista) return;
    compraLista=true;
    cargarCompra(user);
    return;
  }
  setTimeout(()=>{
    if(compraLista) return;
    if(auth.currentUser){ compraLista=true; cargarCompra(auth.currentUser); return; }
    localStorage.setItem('redirect_after_login', location.pathname+location.search);
    location.href='/login.html';
  },1600);
});
</script>
</body>
</html>

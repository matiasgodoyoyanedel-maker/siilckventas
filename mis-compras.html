<!DOCTYPE html>
<html lang="es" data-sv-theme="aurora">
<head>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos de tu cuenta - SiilckVentas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/tema.css">
<script src="/tema.js"></script>
<style>
  body{background:#050014;color:#f4f4f5;font-family:'Plus Jakarta Sans',sans-serif}
  h1,h2{font-family:'Outfit',sans-serif}
  .web-panel{background:rgba(18,18,24,.95);border:1px solid rgba(255,255,255,.07)}
</style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex justify-center">
  <div id="vista-lista" class="hidden w-full max-w-2xl mx-auto space-y-4">
    <a href="/index.html" class="text-xs text-zinc-400 hover:text-white"><i class="fas fa-arrow-left mr-1"></i> Inicio</a>
    <h1 class="text-2xl font-black text-white">Mis compras</h1>
    <p id="lista-estado" class="text-sm text-zinc-400">Cargando tus compras…</p>
    <div id="lista-ordenes" class="space-y-4"></div>
  </div>
  <div id="modal-cuenta" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-md space-y-4">
      <h2 id="modal-cuenta-titulo" class="text-lg font-black text-white">Datos de mi cuenta</h2>
      <div class="space-y-2 text-sm">
        <p class="text-[10px] uppercase text-zinc-500 font-bold">Usuario</p>
        <p id="modal-usuario" class="select-all font-mono text-yellow-300 break-all bg-black rounded-xl px-3 py-2"></p>
        <p class="text-[10px] uppercase text-zinc-500 font-bold">Clave</p>
        <p id="modal-clave" class="select-all font-mono text-yellow-300 break-all bg-black rounded-xl px-3 py-2"></p>
        <p class="text-[10px] uppercase text-zinc-500 font-bold">Correo</p>
        <p id="modal-correo" class="select-all font-mono text-yellow-300 break-all bg-black rounded-xl px-3 py-2"></p>
      </div>
      <button type="button" id="modal-cerrar" class="w-full bg-yellow-400 text-black font-black py-3 rounded-full">Cerrar</button>
    </div>
  </div>
  <div id="vista-detalle" class="max-w-lg w-full space-y-4">
    <a href="/index.html" class="text-xs text-zinc-400 hover:text-white"><i class="fas fa-arrow-left mr-1"></i> Inicio</a>
    <div class="web-panel rounded-3xl p-6 space-y-2 border border-yellow-500/30">
      <h1 class="text-xl font-black text-white">Datos de tu cuenta</h1>
      <p id="estado" class="text-xs text-zinc-400">Cargando la compra…</p>
      <div id="box-transaccion" class="hidden text-left bg-yellow-500/10 border border-yellow-500/40 rounded-2xl p-4 space-y-1">
        <p class="text-xs font-bold text-yellow-300">ID de Transacción:</p>
        <p id="txt-transaccion" class="font-mono font-bold text-white text-lg break-all select-all"></p>
        <p class="text-[11px] text-zinc-400">Guarda este ID. Si tienes dudas, envíame este ID por WhatsApp y te ayudo.</p>
        <button type="button" id="btn-copiar-transaccion" class="text-xs bg-yellow-500/20 text-yellow-200 px-3 py-1.5 rounded-lg font-bold">Copiar ID Transacción</button>
      </div>
    </div>
    <div id="lista" class="space-y-3"></div>
  </div>
<script>
const firebaseConfig={apiKey:"AIzaSyD4PyR975err3q8gPX6JOwpnnM5MXnA5C8",authDomain:"[REDACTED].firebaseapp.com",projectId:"[REDACTED]",storageBucket:"[REDACTED].firebasestorage.app",messagingSenderId:"1081229515356",appId:"1:1081229515356:web:78ccc9fb4053ee54072499"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

function orderId(){
  const q=new URLSearchParams(location.search);
  const directo=q.get('order_id')||q.get('id');
  if(directo) return directo;
  const partes=location.pathname.split('/').filter(Boolean);
  const i=partes.indexOf('mis-compras');
  return i>=0&&partes[i+1]?decodeURIComponent(partes[i+1]):'';
}
const id=orderId();
if(!id){
  document.getElementById('vista-detalle').classList.add('hidden');
  document.getElementById('vista-lista').classList.remove('hidden');
}
const estado=document.getElementById('estado');
const lista=document.getElementById('lista');

function fila(etiqueta, valor){
  const box=document.createElement('div');
  box.className='flex items-center justify-between gap-3 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2';
  const texto=document.createElement('div');
  const k=document.createElement('p');
  k.className='text-[10px] uppercase text-zinc-500 font-bold';
  k.textContent=etiqueta;
  const v=document.createElement('p');
  v.className='text-sm text-yellow-400 font-bold break-all';
  v.textContent=valor||'No indicado';
  texto.appendChild(k); texto.appendChild(v);
  const btn=document.createElement('button');
  btn.type='button';
  btn.className='shrink-0 bg-zinc-800 text-white text-[10px] font-bold px-3 py-2 rounded-lg';
  btn.textContent='Copiar';
  btn.addEventListener('click', async()=>{
    try{ await navigator.clipboard.writeText(valor||''); btn.textContent='Copiado'; }
    catch(e){ btn.textContent='Selecciona el texto'; }
  });
  box.appendChild(texto); box.appendChild(btn);
  return box;
}

function pintar(cuentas){
  lista.textContent='';
  if(!cuentas.length){
    estado.textContent='El pago está confirmado, pero esta orden no tiene datos de cuenta cargados por el vendedor.';
    return;
  }
  estado.textContent='Solo tú puedes ver esto. El anuncio público no muestra la clave.';
  cuentas.forEach(cuenta=>{
    const card=document.createElement('article');
    card.className='web-panel rounded-3xl p-5 space-y-3 border border-emerald-500/30';
    const h=document.createElement('h2');
    h.className='text-sm font-black text-white';
    h.textContent=cuenta.titulo||'Cuenta';
    card.appendChild(h);
    const meta=[cuenta.juego, cuenta.nivel, cuenta.region].filter(Boolean).join(' · ');
    const nota=document.createElement('p');
    nota.className='text-[11px] text-zinc-400';
    nota.textContent=meta ? ('Publicación vendida · '+meta) : 'Estos son los datos de esta publicación.';
    card.appendChild(nota);
    card.appendChild(fila('Correo / usuario', cuenta.email));
    card.appendChild(fila('Clave', cuenta.clave));
    card.appendChild(fila('Teléfono', cuenta.telefono));
    card.appendChild(fila('Recuperación', cuenta.recuperacion));
    lista.appendChild(card);
  });
}

function pesos(n){ return '$' + Number(n || 0).toLocaleString('es-CL'); }
function fechaCl(ms){
  if(!ms) return '';
  return new Date(ms).toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
}
function nombreMetodo(m){ return m === 'mercadopago' ? 'Mercado Pago' : 'Flow'; }
function abrirDatosCuenta(item){
  const tituloCuenta = item.juego ? (item.juego + ' · ' + (item.nombre || 'Datos de mi cuenta')) : (item.nombre || 'Datos de mi cuenta');
  document.getElementById('modal-cuenta-titulo').textContent = tituloCuenta;
  document.getElementById('modal-usuario').textContent = item.account_user || 'No indicado';
  document.getElementById('modal-clave').textContent = item.account_pass || 'No indicado';
  document.getElementById('modal-correo').textContent = item.account_email || 'No indicado';
  document.getElementById('modal-cuenta').classList.remove('hidden');
}
document.getElementById('modal-cerrar').addEventListener('click', () => {
  document.getElementById('modal-cuenta').classList.add('hidden');
});
function pintarOrden(orden){
  const card = document.createElement('article');
  card.className = 'bg-zinc-900 border border-zinc-800 rounded-3xl p-5 space-y-3';
  const cabeza = document.createElement('div');
  cabeza.className = 'flex items-start justify-between gap-3';
  const titulo = document.createElement('div');
  const h = document.createElement('h2');
  h.className = 'text-sm font-black text-white';
  h.textContent = fechaCl(orden.createdAt) || 'Compra';
  const meta = document.createElement('p');
  meta.className = 'text-[11px] text-zinc-400';
  meta.textContent = nombreMetodo(orden.metodo) + ' · ' + pesos(orden.total) + ' · ' + (orden.idCorto || '');
  titulo.appendChild(h);
  titulo.appendChild(meta);
  const estadoOrden = document.createElement('span');
  estadoOrden.className = 'text-[10px] uppercase font-black text-emerald-400';
  estadoOrden.textContent = orden.status || 'pagado';
  cabeza.appendChild(titulo);
  cabeza.appendChild(estadoOrden);
  card.appendChild(cabeza);
  (orden.items || []).forEach((item) => {
    const filaItem = document.createElement('div');
    filaItem.className = 'flex items-center justify-between gap-3 bg-black rounded-2xl px-3 py-3';
    const texto = document.createElement('div');
    texto.className = 'min-w-0';
    const nombre = document.createElement('p');
    nombre.className = 'text-sm text-white font-bold';
    nombre.textContent = item.nombre || 'Producto';
    texto.appendChild(nombre);
    if(item.juego){
      const juego = document.createElement('p');
      juego.className = 'text-[11px] font-black text-yellow-400';
      juego.textContent = item.juego;
      texto.appendChild(juego);
    }
    filaItem.appendChild(texto);
    if(item.tipo === 'cuenta'){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shrink-0 bg-yellow-400 text-black text-[11px] font-black px-4 py-2 rounded-full';
      btn.textContent = 'Ver datos de mi cuenta';
      btn.addEventListener('click', () => abrirDatosCuenta(item));
      filaItem.appendChild(btn);
    }
    card.appendChild(filaItem);
  });
  return card;
}
async function pintarLista(user){
  const box = document.getElementById('lista-ordenes');
  const txt = document.getElementById('lista-estado');
  try{
    const token = await user.getIdToken(true);
    const res = await fetch('/api/orders', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if(!res.ok){ txt.textContent = data.error || 'No se pudieron cargar tus compras.'; return; }
    const ordenes = data.ordenes || [];
    box.textContent = '';
    if(!ordenes.length){ txt.textContent = 'Todavía no tienes compras.'; return; }
    txt.textContent = ordenes.length === 1 ? '1 compra' : (ordenes.length + ' compras');
    ordenes.forEach((orden) => box.appendChild(pintarOrden(orden)));
  }catch(e){
    txt.textContent = 'No se pudieron cargar tus compras. Reintenta en unos segundos.';
  }
}
function exigirCorreoVerificado(user){
  if(user && user.emailVerified === false){
    location.replace('/verificar-correo?email=' + encodeURIComponent(user.email || ''));
    return false;
  }
  return true;
}
auth.onAuthStateChanged(async(user)=>{
  if(!exigirCorreoVerificado(user)) return;
  if(!id){
    document.body.className = 'min-h-screen bg-black text-white p-4 sm:p-8';
    document.getElementById('vista-detalle').classList.add('hidden');
    document.getElementById('vista-lista').classList.remove('hidden');
    document.title = 'Mis compras - SiilckVentas';
    if(!user){
      location.href = '/login?next=/mis-compras';
      return;
    }
    await pintarLista(user);
    return;
  }
  if(!user){
    localStorage.setItem('redirect_after_login', location.pathname+location.search);
    location.href='/login.html';
    return;
  }
  try{
    const token=await user.getIdToken(true);
    const res=await fetch('/api/compra?datos=1&order_id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});
    const data=await res.json();
    if(!res.ok){ estado.textContent=data.error||'No se pudieron mostrar los datos.'; return; }
    const idTx=data.flowOrder||data.mpPaymentId||data.flowTransactionId||data.transactionId||data.id||id;
    const txtTx=document.getElementById('txt-transaccion');
    txtTx.textContent=idTx;
    document.getElementById('box-transaccion').classList.remove('hidden');
    document.getElementById('btn-copiar-transaccion').addEventListener('click', async()=>{
      try{ await navigator.clipboard.writeText(txtTx.textContent||''); }
      catch(e){}
    });
    pintar(data.cuentas||[]);
  }catch(e){
    estado.textContent='No se pudieron cargar los datos. Reintenta en unos segundos.';
  }
});
</script>
<script src="/guardia.js"></script>
</body>
</html>

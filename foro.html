<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Foro Gamer & Discusiones - SiilckVentas</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap');
  body{background-color:#09090b;color:#f4f4f5;font-family:'Plus Jakarta Sans',sans-serif}
  h1,h2,h3,h4{font-family:'Outfit',sans-serif}
  .web-panel{background:rgba(18,18,24,0.92);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.07);box-shadow:0 20px 50px rgba(0,0,0,0.5)}
  #foro-loading-screen{position:fixed;inset:0;background:#09090b;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s ease}
  .loading-spinner{width:50px;height:50px;border:4px solid rgba(234,179,8,0.2);border-top-color:#eab308;border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

<!-- PANTALLA DE CARGA (LOGO) -->
<div id="foro-loading-screen">
  <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-black shadow-2xl mb-4 animate-bounce"><i class="fas fa-comments text-2xl"></i></div>
  <h2 class="text-lg font-black font-heading tracking-tight text-white">SIILCK<span class="text-indigo-400">FORO</span></h2>
  <p class="text-[10px] uppercase tracking-widest text-zinc-400 font-bold mt-1">Cargando discusiones...</p>
  <div class="loading-spinner mt-6"></div>
</div>

<div class="max-w-4xl w-full space-y-6">
  <div class="web-panel rounded-3xl p-6 border border-indigo-500/30 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/40 flex items-center justify-center text-xl font-black"><i class="fas fa-comments"></i></div>
      <div>
        <h2 class="text-xl font-black text-white">Foro Gamer & Discusiones</h2>
        <p class="text-xs text-indigo-400 font-bold">Comparte estrategias, guías y debate con la comunidad</p>
      </div>
    </div>
    <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider transition"><i class="fas fa-arrow-left mr-1.5"></i> Volver al Marketplace</a>
  </div>

  <div class="web-panel rounded-3xl p-6 space-y-4 border border-zinc-800">
    <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wider border-b border-zinc-800 pb-3"><i class="fas fa-plus-circle mr-1.5"></i> Crear Nuevo Tema en el Foro</h3>
    <div class="space-y-3 text-xs">
      <input type="text" id="foro-titulo" placeholder="Título del tema (Ej: Mejores estrategias para subir en ranked)..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white">
      <textarea id="foro-contenido" rows="3" placeholder="Escribe tu mensaje o guía..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white resize-none"></textarea>
      <button onclick="crearTemaForo()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl uppercase tracking-wider shadow">Publicar Tema</button>
    </div>
  </div>

  <div class="space-y-4" id="foro-lista-temas">
    <p class="text-xs text-zinc-500 text-center py-12">Cargando temas del foro...</p>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD4PyR975err3q8gPX6JOwpnnM5MXnA5C8",authDomain:"siilckventasfull.firebaseapp.com",projectId:"siilckventasfull",storageBucket:"siilckventasfull.firebasestorage.app",messagingSenderId:"1081229515356",appId:"1:1081229515356:web:78ccc9fb4053ee54072499"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const OWNER_UID="YwjfajkyMXMRHd18eII4dwV03NF3";

auth.onAuthStateChanged((u)=>{
  setTimeout(()=>{
    const loader = document.getElementById('foro-loading-screen');
    if(loader){ loader.style.opacity = '0'; setTimeout(()=>loader.remove(), 400); }
  }, 300);
  cargarTemasForoEnVivo();
});

async function crearTemaForo(){
  if(!auth.currentUser){ alert("Debes iniciar sesión para publicar en el foro."); window.location.href="login.html"; return; }
  const titulo = document.getElementById('foro-titulo').value.trim();
  const contenido = document.getElementById('foro-contenido').value.trim();
  if(!titulo || !contenido){ alert("Completa todos los campos."); return; }

  const userDoc = await db.collection('perfiles').doc(auth.currentUser.uid).get();
  const uData = userDoc.exists ? userDoc.data() : {};

  await db.collection('foros').add({
    autorUid: auth.currentUser.uid,
    autorNombre: uData.username || auth.currentUser.email.split('@')[0],
    autorLogo: uData.logo || "",
    autorRango: uData.tipoVip === 'pro' ? '👑 VIP Pro' : (uData.tipoVip === 'basico' ? '⭐ VIP Básico' : 'Gamer'),
    titulo: titulo,
    contenido: contenido,
    likes: [],
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById('foro-titulo').value = "";
  document.getElementById('foro-contenido').value = "";
  alert("¡Tema publicado con éxito!");
}

function cargarTemasForoEnVivo(){
  db.collection('foros').orderBy('fecha', 'desc').onSnapshot(async snapshot => {
    let h = "";
    for(const docSnap of snapshot.docs){
      const t = docSnap.data();
      const id = docSnap.id;
      const likesCount = (t.likes || []).length;
      const yaDioLike = auth.currentUser && (t.likes || []).includes(auth.currentUser.uid);
      const likeBtnClass = yaDioLike ? "text-rose-500 bg-rose-500/10 border-rose-500/30" : "text-zinc-400 bg-zinc-900 border-zinc-800 hover:text-white";

      // Obtener datos frescos del perfil del autor para asegurar perfiles reales
      let autorNombre = t.autorNombre || "Gamer";
      let autorLogoHtml = t.autorLogo ? `<img src="${t.autorLogo}" class="w-full h-full object-cover">` : `<i class="fas fa-user text-xs text-indigo-400"></i>`;
      let autorRango = t.autorRango || "Gamer";

      if(t.autorUid){
        const pDoc = await db.collection('perfiles').doc(t.autorUid).get();
        if(pDoc.exists){
          const pD = pDoc.data();
          autorNombre = pD.username || autorNombre;
          if(pD.logo) autorLogoHtml = `<img src="${pD.logo}" class="w-full h-full object-cover">`;
          autorRango = pD.tipoVip === 'pro' ? '👑 VIP Pro' : (pD.tipoVip === 'basico' ? '⭐ VIP Básico' : 'Gamer');
        }
      }

      const esDueno = auth.currentUser && (auth.currentUser.uid === t.autorUid || auth.currentUser.uid === OWNER_UID);
      const btnBorrar = esDueno ? `<button onclick="eliminarTemaForo('${id}')" class="text-xs text-rose-400 hover:text-rose-300 ml-auto"><i class="fas fa-trash"></i></button>` : "";

      h += `<div class="web-panel rounded-3xl p-6 space-y-4 border border-zinc-800">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-zinc-900 border border-indigo-500/40 flex items-center justify-center overflow-hidden shrink-0 shadow">${autorLogoHtml}</div>
            <div>
              <h4 class="font-bold text-white text-xs">@${autorNombre}</h4>
              <span class="text-[10px] text-indigo-400 font-semibold">${autorRango}</span>
            </div>
          </div>
          ${btnBorrar}
        </div>
        <div class="space-y-2">
          <h3 class="text-base font-black text-white font-heading">${t.titulo}</h3>
          <p class="text-xs text-zinc-300 leading-relaxed">${t.contenido}</p>
        </div>
        <div class="flex items-center gap-2 pt-2 border-t border-zinc-800">
          <button onclick="toggleLikeForo('${id}')" class="px-3.5 py-2 rounded-xl border text-xs font-bold flex items-center gap-2 transition ${likeBtnClass}">
            <i class="fas fa-heart"></i> <span>Me gusta (${likesCount})</span>
          </button>
        </div>
      </div>`;
    }
    document.getElementById('foro-lista-temas').innerHTML = h || `<p class="text-xs text-zinc-500 text-center py-12">No hay temas en el foro todavía. ¡Crea el primero!</p>`;
  });
}

async function toggleLikeForo(foroId){
  if(!auth.currentUser){ alert("Debes iniciar sesión para dar Me gusta."); window.location.href="login.html"; return; }
  const ref = db.collection('foros').doc(foroId);
  const doc = await ref.get();
  if(!doc.exists) return;
  const data = doc.data();
  let likes = data.likes || [];
  const uid = auth.currentUser.uid;

  if(likes.includes(uid)){
    likes = likes.filter(id => id !== uid);
  }else{
    likes.push(uid);
  }
  await ref.update({likes: likes});
}

async function eliminarTemaForo(foroId){
  if(confirm("¿Estás seguro de eliminar este tema del foro?")){
    await db.collection('foros').doc(foroId).delete();
    alert("Tema eliminado con éxito.");
  }
}
</script>
</body>
</html>
